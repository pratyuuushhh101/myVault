
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen p-6 text-white">

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl">Your Accounts</h1>
    <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded">Logout</button>
  </div>

  <button onclick="openCreateAccount()"
  class="mb-6 bg-blue-600 hover:bg-blue-700 transition px-4 py-2 rounded-lg">
  + Create New Account
</button>

<div id="accounts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

<!-- Create Account Modal -->
<div id="createModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
  <div class="bg-gray-800 p-6 rounded-xl w-80">
    <h2 class="text-lg mb-4">Create Account</h2>

    <select id="accountType" class="w-full p-2 rounded text-black mb-3">
      <option value="">Select type</option>
      <option value="SAVINGS">Savings</option>
      <option value="CURRENT">Current</option>
    </select>

    <p id="createError" class="text-red-400 text-sm mb-2 hidden"></p>

    <div class="flex gap-2">
      <button onclick="createAccount()" class="flex-1 bg-green-600 py-2 rounded">
        Create
      </button>
      <button onclick="closeCreateAccount()" class="flex-1 bg-gray-600 py-2 rounded">
        Cancel
      </button>
    </div>
  </div>
</div>

<div id="accounts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <script src="dashboard.js"></script>
</body>
</html>
