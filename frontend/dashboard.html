<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen p-6 text-white">

  <h1 class="text-2xl mb-4">Your Accounts</h1>
  <div id="accounts"></div>

  <button onclick="logout()" class="mt-6 bg-red-600 px-4 py-2 rounded">
    Logout
  </button>

  <script>
    const BASE_URL = "http://127.0.0.1:8000/api";

    async function loadAccounts() {
      const token = localStorage.getItem("access");
      if (!token) {
        window.location.href = "index.html";
        return;
      }

      const res = await fetch(`${BASE_URL}/accounts/`, {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401) {
        localStorage.clear();
        window.location.href = "index.html";
        return;
      }

      const data = await res.json();
      const container = document.getElementById("accounts");

      container.innerHTML = data.map(acc => `
        <div class="bg-gray-800 p-4 rounded mb-2">
          <p>Type: ${acc.account_type}</p>
          <p>Balance: ${acc.balance}</p>
        </div>
      `).join("");
    }

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }

    loadAccounts();
  </script>
</body>
</html>
