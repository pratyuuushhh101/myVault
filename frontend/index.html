<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyVault Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center">

  <div class="bg-gray-800 p-8 rounded w-80">
    <h1 class="text-white text-xl mb-4">Login</h1>

    <input id="username" class="w-full mb-3 p-2 rounded" placeholder="Username" />
    <input id="password" class="w-full mb-3 p-2 rounded" type="password" placeholder="Password" />

    <p id="error" class="text-red-500 mb-2 hidden"></p>

    <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded">
      Login
    </button>
  </div>

  <script src="main.js"></script>
</body>
</html>
